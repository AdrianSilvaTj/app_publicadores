<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#212529" />
  <title>Historial de acciones</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="style.css?v=20261002" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark" id="menu" style="min-height: 56px"></nav>
  <div id="bannerEstado" class="alert text-center m-0 py-2 d-none banner" role="alert"></div>
  <main class="marginBody">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <h1 class="h2 mb-0">📋 Historial de acciones</h1>
      <a class="btn btn-outline-secondary" href="index.html">Volver al inicio</a>
    </div>
    <section class="card card-shadow">
      <div class="card-body">
        <div class="row g-3 mb-3">
          <div class="col-sm-4 col-md-3">
            <label for="filtroAnioAcciones" class="form-label">Año</label>
            <select id="filtroAnioAcciones" class="form-select" disabled>
              <option value="">Cargando...</option>
            </select>
          </div>
          <div class="col-sm-8 col-md-9">
            <label for="buscarAccion" class="form-label">Buscar por descripción</label>
            <input id="buscarAccion" class="form-control" type="search" placeholder="Escribe parte de la acción..." disabled />
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col">Fecha y hora</th>
                <th scope="col">Nombre del publicador</th>
                <th scope="col">Acción</th>
              </tr>
            </thead>
            <tbody id="tablaHistorialAcciones">
              <tr><td colspan="3" class="text-center">Cargando acciones...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <script src="main.js"></script>
  <script src="scripts/pwa-install.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await cargarMenuYScripts();
      verificarSesionActiva();
      await cargarHistorialCompletoAcciones();
    });
  </script>
</body>
</html>
