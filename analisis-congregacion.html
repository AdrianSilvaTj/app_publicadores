<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Análisis de la congregación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" id="menu" style="min-height: 56px"></nav>
    <div id="bannerEstado" class="alert text-center m-0 py-2 d-none banner" role="alert"></div>
    <main class="marginBody">
      <h2>📊 Análisis de la congregación</h2>
      <div class="row g-3 my-2">
        <div class="col-md-4">
          <label for="anioServicioAnalisis" class="form-label">Año de servicio</label>
          <select class="form-select" id="anioServicioAnalisis"></select>
          <div class="form-text">Cada año de servicio comprende septiembre a agosto.</div>
        </div>
      </div>
      <section class="card card-shadow mt-3" aria-labelledby="tituloPrecursoresRegulares">
        <div class="card-header group-header-color d-flex justify-content-between align-items-center flex-wrap gap-2">
          <h3 id="tituloPrecursoresRegulares" class="h5 mb-0">🔴 Precursores regulares</h3>
          <span id="totalHorasRegulares" class="fw-semibold">Total: 0 horas</span>
        </div>
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0">
            <thead class="table-light"><tr><th scope="col">Publicador</th><th scope="col" class="text-end">Horas del año de servicio</th><th scope="col" class="text-end">Acciones</th></tr></thead>
            <tbody id="listaPrecursoresRegulares"><tr><td colspan="3" class="text-center">Cargando...</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/docx@9.0.3/build/index.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="main.js"></script>
    <script src="scripts/date-functions.js"></script>
    <script src="scripts/utils-functions.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        await cargarMenuYScripts();
        verificarSesionActiva();
      });
    </script>
  </body>
</html>
