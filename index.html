<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#212529" />
  <title>Publicadores</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="style.css?v=20261002" rel="stylesheet" />
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark" id="menu" style="min-height: 56px">
    
  </nav>
  <div id="bannerEstado" class="alert text-center m-0 py-2 d-none banner" role="alert"></div>

  <!-- CONTENIDO DE LA SECCIÓN -->
  <div class="marginBody">
    <h1>👋 Bienvenido</h1>
    <div class="tarjetas-principal">
      <section class="card card-shadow" aria-labelledby="tituloAvisos">
        <div class="card-header group-header-color">
          <h2 id="tituloAvisos" class="h5 mb-0">🛑 Avisos y recordatorios importantes</h2>
        </div>
        <div id="listaAvisos" class="card-body">
          <p class="text-center text-muted mb-0">Cargando avisos...</p>
        </div>
      </section>

    <section class="card card-shadow" aria-labelledby="tituloTotales">
      <div class="card-header group-header-color">
        <h2 id="tituloTotales" class="h5 mb-0">📊 Totales de publicadores</h2>
      </div>
      <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-light">
            <tr><th scope="col">Categoría</th><th scope="col" class="text-end">Total</th></tr>
          </thead>
          <tbody id="totalesPublicadores">
            <tr><td colspan="2" class="text-center">Cargando totales...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card card-shadow" aria-labelledby="tituloHistorialEstados">
      <div class="card-header group-header-color">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h2 id="tituloHistorialEstados" class="h5 mb-0">📋 Últimas acciones realizadas</h2>
            <a class="btn btn-sm btn-outline-primary" href="historial-acciones.html">Ver todas</a>
          </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr><th scope="col">Fecha y hora</th><th scope="col">Acción</th></tr>
          </thead>
          <tbody id="historialEstadosPublicadores">
            <tr><td colspan="2" class="text-center">Cargando historial...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    </div>
  </div>

  <script src="main.js"></script>
  <script src="scripts/pwa-install.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        await cargarMenuYScripts();
        const config = await cargarConfiguracionGlobal();
        if (config) {
          document.querySelector("h1").innerText = `👋 Bienvenido a Cong. ${config.nombreCongregacion}`;
        }
        await cargarTotalesPublicadores();
        await cargarHistorialEstadosPublicadores();
        await cargarAvisos();
      } finally {
        cerrarBanner();
      }
    });

    async function cargarTotalesPublicadores() {
      const tbody = document.getElementById("totalesPublicadores");
      try {
        const publicadores = await obtenerDataColeccion("publicadores");
        const registros = publicadores.filter((pub) => Number(pub.grupo) > 0);
        const activos = registros.filter(
          (pub) => !(pub.estadoEspiritual || []).includes("Inactivo")
        );
        const inactivos = registros.filter((pub) =>
          (pub.estadoEspiritual || []).includes("Inactivo")
        );
        const ahora = new Date();
        const mesActual = `${ahora.getFullYear()}-${ahora.getMonth() + 1}`;
        const totales = [
          ["Publicadores activos", activos.length, "🟢", "total-activos"],
          ["Publicadores inactivos", inactivos.length, "⚫", "total-inactivos"],
          ["Ancianos", activos.filter((pub) => (pub.estadoEspiritual || []).includes("Anciano")).length, "🟠", "total-ancianos"],
          ["Siervos ministeriales", activos.filter((pub) => (pub.estadoEspiritual || []).includes("Siervo ministerial")).length, "🔵", "total-siervos"],
          ["Precursores regulares", activos.filter((pub) => (pub.estadoEspiritual || []).includes("Precursor regular")).length, "🔴", "total-regulares"],
          ["Precursores auxiliares indefinidos", activos.filter((pub) => (pub.estadoEspiritual || []).includes("Precursor auxiliar")).length, "🟡", "total-auxiliares"],
          ["Precursores auxiliares este mes", activos.filter((pub) => (pub.mesesAuxiliar || []).includes(mesActual)).length, "🟢", "total-auxiliares-mes"],
        ];

        tbody.replaceChildren(...totales.map(([categoria, total, icono, estilo]) => {
          const fila = document.createElement("tr");
          fila.className = "fila-total";
          const nombre = document.createElement("th");
          nombre.scope = "row";
          const indicador = document.createElement("span");
          indicador.className = `indicador-total ${estilo}`;
          indicador.setAttribute("aria-hidden", "true");
          const icon = document.createElement("span");
          icon.className = "icono-total";
          icon.textContent = icono;
          const etiqueta = document.createElement("span");
          etiqueta.textContent = categoria;
          indicador.append(icon);
          nombre.append(indicador, etiqueta);
          const valor = document.createElement("td");
          valor.className = "text-end";
          const cifra = document.createElement("span");
          cifra.className = `cifra-total ${estilo}`;
          cifra.textContent = total;
          valor.appendChild(cifra);
          fila.append(nombre, valor);
          return fila;
        }));
      } catch (error) {
        console.error("Error al cargar totales de publicadores:", error);
        tbody.innerHTML = '<tr><td colspan="2" class="text-center text-danger">No se pudieron cargar los totales.</td></tr>';
      }
    }

    async function cargarAvisos() {
      const contenedor = document.getElementById("listaAvisos");
      try {
        const snapshot = await db.collection("Avisos").get();
        if (snapshot.empty) {
          contenedor.innerHTML = '<p class="text-center text-muted mb-0">No hay avisos por el momento.</p>';
          return;
        }

        contenedor.replaceChildren(...snapshot.docs.map((documento) => {
          const aviso = documento.data();
          const elemento = document.createElement("article");
          elemento.className = "aviso-item";
          const titulo = document.createElement("h3");
          titulo.className = "h6 mb-1";
          titulo.textContent = aviso.titulo || aviso.nombre || "Aviso";
          elemento.appendChild(titulo);

          const mensaje = aviso.mensaje || aviso.descripcion || aviso.contenido || aviso.texto;
          if (mensaje) {
            const texto = document.createElement("p");
            texto.className = "mb-1";
            texto.textContent = mensaje;
            elemento.appendChild(texto);
          }

          const fecha = aviso.fecha?.toDate?.() || (aviso.fecha ? new Date(aviso.fecha) : null);
          if (fecha && !Number.isNaN(fecha.getTime())) {
            const fechaTexto = document.createElement("small");
            fechaTexto.className = "text-muted";
            fechaTexto.textContent = new Intl.DateTimeFormat("es-CO", { dateStyle: "medium", timeZone: "America/Bogota" }).format(fecha);
            elemento.appendChild(fechaTexto);
          }
          return elemento;
        }));
      } catch (error) {
        console.error("Error al cargar avisos:", error);
        contenedor.innerHTML = '<p class="text-center text-danger mb-0">No se pudieron cargar los avisos.</p>';
      }
    }

    async function cargarHistorialEstadosPublicadores() {
      const tbody = document.getElementById("historialEstadosPublicadores");
      try {
        const snapshot = await db
          .collection("historialEstadosPublicadores")
          .orderBy("createdAt", "desc")
          .limit(20)
          .get();

        if (snapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">Aún no hay cambios de estado registrados.</td></tr>';
          return;
        }

        const formatoFecha = new Intl.DateTimeFormat("es-CO", {
          dateStyle: "short",
          timeStyle: "short",
          timeZone: "America/Bogota",
        });
        tbody.replaceChildren(...snapshot.docs.map((documento) => {
          const registro = documento.data();
          const fila = document.createElement("tr");
          fila.classList = ["col-9"];
          const fecha = document.createElement("td");
          fecha.classList = ["col-3"];
          const instante = registro.createdAt?.toDate?.();
          fecha.textContent = instante ? formatoFecha.format(instante) : "—";
          const accion = document.createElement("td");
          accion.textContent = registro.descripcion || "Cambio de estado";
          fila.append(fecha, accion);
          return fila;
        }));
      } catch (error) {
        console.error("Error al cargar el historial de estados:", error);
        tbody.innerHTML = '<tr><td colspan="2" class="text-center text-danger">No se pudo cargar el historial.</td></tr>';
      }
    }
  </script>
</body>
</html>
