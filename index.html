<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#212529" />
  <title>Publicadores</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="style.css?v=20261021-app-background" rel="stylesheet" />
  <link href="styles/tareas.css?v=20261019-task-status" rel="stylesheet" />
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark" id="menu" style="min-height: 56px">
    
  </nav>
  <div id="bannerEstado" class="alert text-center m-0 py-2 d-none banner" role="alert"></div>

  <!-- CONTENIDO DE LA SECCIÓN -->
  <div class="marginBody">
    <h1>👋 Bienvenido</h1>
    <div class="tarjetas-principal">
      <section class="card card-shadow" aria-labelledby="tituloTareasProgramadas">
        <div class="card-header group-header-color">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h2 id="tituloTareasProgramadas" class="h5 mb-0">
              🛑 Tareas programadas
            </h2>
            <a href="pages/tareas.html" class="btn btn-sm btn-outline-primary" title="Ver todas las tareas programadas" aria-label="Ver todas las tareas programadas">
              <span aria-hidden="true">📋</span><span class="visually-hidden">Ver todas las tareas programadas</span>
            </a>
          </div>
        </div>
      
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col">Título</th>
                <th scope="col">Fecha propuesta</th>
              </tr>
            </thead>
            <tbody id="listaTareasProgramadas">
              <tr>
                <td colspan="2" class="text-center text-muted">
                  Cargando tareas...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="card card-shadow" aria-labelledby="tituloTotales">
        <div class="card-header group-header-color">
          <h2 id="tituloTotales" class="h5 mb-0">📊 Totales de publicadores</h2>
        </div>
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0">
            <thead class="table-light">
              <tr><th scope="col">Categoría</th><th scope="col" class="text-end">Total</th></tr>
            </thead>
            <tbody id="totalesPublicadores">
              <tr><td colspan="2" class="text-center">Cargando totales...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="card card-shadow" aria-labelledby="tituloHistorialEstados">
        <div class="card-header group-header-color">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
              <h2 id="tituloHistorialEstados" class="h5 mb-0">📋 Últimas acciones realizadas</h2>
              <a class="btn btn-sm btn-outline-primary" href="pages/historial-acciones.html" title="Ver todas las acciones" aria-label="Ver todas las acciones">
                <span aria-hidden="true">📋</span><span class="visually-hidden">Ver todas las acciones</span>
              </a>
            </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr><th scope="col">Fecha y hora</th><th scope="col">Acción</th></tr>
            </thead>
            <tbody id="historialEstadosPublicadores">
              <tr><td colspan="2" class="text-center">Cargando historial...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script src="main.js"></script>
  <script src="scripts/pwa-install.js" defer></script>
  <script src="scripts/index.js?v=20261021-limite-30"></script>
</body>
</html>
