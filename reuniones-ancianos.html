<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#212529" />
  <title>Reuniones de ancianos</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="style.css?v=20261002" rel="stylesheet" />
  <link href="styles/reuniones-ancianos.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark" id="menu" style="min-height: 56px"></nav>
  <div id="bannerEstado" class="alert text-center m-0 py-2 d-none banner" role="alert"></div>

  <div class="marginBody">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h3 class="mb-0">Reuniones de ancianos</h3>
      <a class="btn btn-primary d-flex align-items-center" href="crear-reunion-ancianos.html" aria-label="Crear nueva reunión de ancianos" title="Crear nueva reunión de ancianos">
        <span class="me-2 d-none d-sm-inline">&#43; Crear</span>
        <span class="d-inline d-sm-none" aria-hidden="true">&#43;</span>
      </a>
    </div>
    <div id="listaReunionesAncianos" class="row g-3" aria-live="polite">
      <div class="col-12"><p class="text-muted">Cargando reuniones...</p></div>
    </div>
    <div class="text-center mt-4">
      <button id="verMasReunionesAncianos" class="btn btn-outline-primary d-none" type="button">Ver más</button>
    </div>
  </div>

  <script src="main.js"></script>
  <script src="scripts/pwa-install.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const menuCargado = await cargarMenuYScripts();
        if (!menuCargado) return;
        await inicializarListaReunionesAncianos();
      } finally {
        cerrarBanner();
      }
    });
  </script>
</body>
</html>
