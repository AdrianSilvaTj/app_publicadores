<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#212529" />
  <title>Reuniones de ancianos</title>
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../style.css?v=20261021-app-background" rel="stylesheet" />
  <link href="../styles/reuniones-ancianos.css?v=20261021-vista-modal" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark" id="menu" style="min-height: 56px"></nav>
  <div id="bannerEstado" class="alert text-center m-0 py-2 d-none banner" role="alert"></div>

  <div class="marginBody">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h3 class="mb-0 reuniones-ancianos-titulo">Reuniones de ancianos</h3>
      <a class="btn btn-primary reuniones-ancianos-crear" href="crear-reunion-ancianos.html" aria-label="Crear nueva reunión de ancianos" title="Crear nueva reunión de ancianos">
        <span aria-hidden="true">&#43; </span>Crear
      </a>
    </div>
    <div id="listaReunionesAncianos" class="row g-3" aria-live="polite">
      <div class="col-12"><p class="text-muted">Cargando reuniones...</p></div>
    </div>
    <nav id="paginacionReunionesAncianos" class="mt-3 mb-4 d-none" aria-label="Páginas de reuniones de ancianos">
      <p id="resumenPaginacionReunionesAncianos" class="small text-muted text-center mb-2"></p>
      <ul id="controlesPaginacionReunionesAncianos" class="pagination pagination-sm flex-wrap justify-content-center mb-0"></ul>
    </nav>
  </div>

  <div class="modal fade" id="modalLecturaReunionAncianos" tabindex="-1" aria-labelledby="tituloLecturaReunionAncianos" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h2 class="modal-title fs-5" id="tituloLecturaReunionAncianos">Reunión</h2>
            <p class="small text-muted mb-0" id="fechaLecturaReunionAncianos"></p>
          </div>
          <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body modal-lectura-reunion-contenido" id="contenidoLecturaReunionAncianos"></div>
        <div class="modal-footer modal-actions">
          <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">❌ Cancelar</button>
          <button class="btn btn-primary" id="editarReunionAncianosModal" type="button">✏️ Editar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="../main.js?v=20261021-reuniones-vista"></script>
  <script src="../scripts/pwa-install.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const menuCargado = await cargarMenuYScripts();
        if (!menuCargado) return;
        await inicializarListaReunionesAncianos();
      } finally {
        cerrarBanner();
      }
    });
  </script>
</body>
</html>
