<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#212529" />
  <title>Crear reunión de ancianos</title>
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../style.css?v=20261011-layout" rel="stylesheet" />
  <link href="../styles/reuniones-ancianos.css?v=20261019-word-color-palette" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark" id="menu" style="min-height: 56px"></nav>
  <div id="bannerEstado" class="alert text-center m-0 py-2 d-none banner" role="alert"></div>

  <div class="marginBody">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h3 id="tituloEditorReunionAncianos" class="mb-0">Crear reunión de ancianos</h3>
      <a class="btn btn-secondary" href="reuniones-ancianos.html">⬅ Volver a reuniones</a>
    </div>
    <form id="formReunionAncianos" class="card card-shadow p-3 p-md-4 group-header-color">
      <div id="estadoEditorAncianos" class="alert d-none mb-3" role="alert"></div>
      <div id="avisoBorradorAncianos" class="alert alert-info d-none mb-3" role="status">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2">
          <span id="textoAvisoBorradorAncianos"></span>
          <div class="d-flex gap-2 flex-shrink-0">
            <button id="restaurarBorradorAncianos" class="btn btn-sm btn-primary" type="button">Restaurar</button>
            <button id="descartarBorradorAncianos" class="btn btn-sm btn-outline-secondary" type="button">Descartar</button>
          </div>
        </div>
      </div>
      <div id="estadoBorradorAncianos" class="small text-muted mb-3" aria-live="polite"></div>
      <div class="row g-3 mb-3">
        <div class="col-12 col-md-4">
          <label class="form-label" for="fechaReunionAncianos">Fecha</label>
          <input class="form-control" id="fechaReunionAncianos" name="fecha" type="date" required />
        </div>
        <div class="col-12 col-md-8">
          <label class="form-label" for="temaReunionAncianos">Tema</label>
          <input class="form-control" id="temaReunionAncianos" name="tema" type="text" maxlength="180" required />
        </div>
      </div>

      <label class="form-label" id="etiquetaEditorAncianos">Contenido</label>
      <div class="editor-toolbar btn-toolbar flex-wrap gap-2 mb-2" role="toolbar" aria-label="Formato del texto">
        <div class="btn-group btn-group-sm" role="group" aria-label="Estilos de texto">
          <button class="btn btn-outline-secondary" type="button" data-editor-command="bold" aria-label="Negrita" title="Negrita"><strong>N</strong></button>
          <button class="btn btn-outline-secondary" type="button" data-editor-command="italic" aria-label="Cursiva" title="Cursiva"><em>C</em></button>
          <button class="btn btn-outline-secondary" type="button" data-editor-command="underline" aria-label="Subrayado" title="Subrayado"><u>S</u></button>
        </div>
        <div class="btn-group btn-group-sm" role="group" aria-label="Listas">
          <button class="btn btn-outline-secondary" type="button" data-editor-command="insertUnorderedList" title="Viñetas">• Viñetas</button>
          <button class="btn btn-outline-secondary" type="button" data-editor-command="insertOrderedList" title="Lista numerada">1. Lista</button>
        </div>
        <div class="btn-group btn-group-sm color-palette-control" role="group" aria-label="Color del texto">
          <button class="btn btn-outline-secondary" id="aplicarUltimoColorAncianos" type="button" aria-label="Aplicar el último color seleccionado" title="Aplicar el último color seleccionado">
            <span aria-hidden="true" class="color-palette-icon">A</span>
          </button>
          <button class="btn btn-outline-secondary dropdown-toggle dropdown-toggle-split" id="botonPaletaColorAncianos" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Mostrar paleta de colores" title="Mostrar paleta de colores">
            <span class="visually-hidden">Mostrar paleta de colores</span>
          </button>
          <div class="dropdown-menu p-2" aria-labelledby="botonPaletaColorAncianos">
            <div id="paletaColorAncianos" class="color-palette" role="group" aria-label="Colores de texto">
              <button class="color-swatch" type="button" style="--swatch-color:#212529" data-color-texto="#212529" aria-label="Negro" title="Negro"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#6c757d" data-color-texto="#6c757d" aria-label="Gris" title="Gris"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#adb5bd" data-color-texto="#adb5bd" aria-label="Plata" title="Plata"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#ffffff" data-color-texto="#ffffff" aria-label="Blanco" title="Blanco"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#dc3545" data-color-texto="#dc3545" aria-label="Rojo" title="Rojo"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#842029" data-color-texto="#842029" aria-label="Rojo oscuro" title="Rojo oscuro"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#fd7e14" data-color-texto="#fd7e14" aria-label="Naranja" title="Naranja"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#ff7f50" data-color-texto="#ff7f50" aria-label="Coral" title="Coral"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#ffc107" data-color-texto="#ffc107" aria-label="Ámbar" title="Ámbar"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#ffeb3b" data-color-texto="#ffeb3b" aria-label="Amarillo" title="Amarillo"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#198754" data-color-texto="#198754" aria-label="Verde" title="Verde"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#146c43" data-color-texto="#146c43" aria-label="Verde oscuro" title="Verde oscuro"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#84cc16" data-color-texto="#84cc16" aria-label="Lima" title="Lima"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#20c997" data-color-texto="#20c997" aria-label="Turquesa" title="Turquesa"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#0dcaf0" data-color-texto="#0dcaf0" aria-label="Cian" title="Cian"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#0d6efd" data-color-texto="#0d6efd" aria-label="Azul" title="Azul"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#0a58ca" data-color-texto="#0a58ca" aria-label="Azul oscuro" title="Azul oscuro"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#6610f2" data-color-texto="#6610f2" aria-label="Índigo" title="Índigo"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#6f42c1" data-color-texto="#6f42c1" aria-label="Violeta" title="Violeta"></button>
              <button class="color-swatch" type="button" style="--swatch-color:#d63384" data-color-texto="#d63384" aria-label="Rosa" title="Rosa"></button>
            </div>
          </div>
        </div>
        <button class="btn btn-outline-secondary btn-sm" type="button" data-editor-command="removeFormat">Quitar formato</button>
      </div>
      <div id="editorReunionAncianos" class="editor-reunion-ancianos form-control" contenteditable="true" role="textbox" aria-labelledby="etiquetaEditorAncianos" aria-multiline="true"></div>
      <div class="reunion-ancianos-acciones d-flex flex-wrap justify-content-end gap-2 mt-4">
        <a class="btn btn-secondary" href="reuniones-ancianos.html">❌ Cancelar</a>
        <button id="guardarReunionAncianos" class="btn btn-success" type="submit">💾 Guardar</button>
      </div>
    </form>
  </div>

  <script src="../main.js"></script>
  <script src="../scripts/pwa-install.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const menuCargado = await cargarMenuYScripts();
        if (!menuCargado) return;
        await inicializarEditorReunionAncianos();
      } finally {
        cerrarBanner();
      }
    });
  </script>
</body>
</html>
